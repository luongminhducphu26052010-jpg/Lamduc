<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart To Falling Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,120,180,0.2), transparent 30%),
        radial-gradient(circle at bottom, rgba(120,100,255,0.25), transparent 32%),
        linear-gradient(180deg,#0f0520 0%,#010108 100%);
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(2px 2px at 20% 70%, rgba(255,255,255,.8), transparent 60%),
        radial-gradient(1.5px 1.5px at 35% 35%, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(2px 2px at 50% 15%, rgba(255,255,255,.85), transparent 60%),
        radial-gradient(1.5px 1.5px at 65% 45%, rgba(255,255,255,.88), transparent 60%),
        radial-gradient(2px 2px at 82% 30%, rgba(255,255,255,.92), transparent 60%),
        radial-gradient(2px 2px at 90% 72%, rgba(255,255,255,.86), transparent 60%);
      animation:twinkle 4s ease-in-out infinite;
    }

    @keyframes twinkle{
      0%,100%{
        opacity:1;
      }
      50%{
        opacity:.4;
      }
    }

    #heart{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      background:rgba(0,0,0,0.12);
      transition:opacity 1.4s ease, transform 1.4s ease, filter 1.4s ease;
    }

    #heart.hide{
      opacity:0;
      transform:scale(.9);
      filter:blur(5px);
      pointer-events:none;
    }

    #falling-scene{
      position:absolute;
      inset:0;
      z-index:2;
      opacity:0;
      transition:1.5s;
      overflow:hidden;
      pointer-events:none;
    }

    #falling-scene.show{
      opacity:1;
      pointer-events:auto;
    }

    .photo-container{
      position:absolute;
      display:flex;
      flex-direction:column;
      align-items:center;
      opacity:0;
      animation:floatPhoto 4s ease-in-out infinite;
    }

    @keyframes floatPhoto{
      0%{
        transform:translateY(0px) rotate(-2deg);
      }
      50%{
        transform:translateY(-10px) rotate(2deg);
      }
      100%{
        transform:translateY(0px) rotate(-2deg);
      }
    }

    .string{
      width:5px;
      background:linear-gradient(to bottom, rgba(255,255,255,0.98), rgba(255,255,255,0.5));
      box-shadow:
        0 0 10px rgba(255,120,190,1),
        0 0 15px rgba(160,120,255,.8);
      border-radius:5px;
    }

    .photo-frame{
      width:130px;
      height:175px;
      border-radius:20px;
      overflow:hidden;
      border:5px solid rgba(255,255,255,.9);
      background:rgba(255,255,255,.15);
      box-shadow:
        0 25px 60px rgba(0,0,0,.8),
        0 0 35px rgba(255,120,190,.45);
      margin-top:-5px;
      position:relative;
    }

    @media (max-width: 768px) {
      .photo-frame{
        width:90px;
        height:120px;
      }
    }

    .photo-frame::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        135deg,
        rgba(255,255,255,.45) 0%,
        rgba(255,255,255,.15) 35%,
        transparent 70%
      );
    }

    .photo-frame img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    #message-container{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      z-index:3;
      opacity:0;
      pointer-events:none;
      transition:1s;
      padding:20px;
    }

    #message-container.show{
      opacity:1;
      pointer-events:auto;
    }

    #birthday-message{
      color:white;
      font-size:1.4rem;
      text-align:center;
      text-shadow:
        0 0 30px rgba(255,120,190,1),
        0 0 60px rgba(160,120,255,.9),
        0 0 100px rgba(255,120,190,.6);
      font-weight:bold;
      letter-spacing:1px;
      line-height:1.6;
      font-family:'Dancing Script', cursive; max-width:95vw; word-wrap:break-word;
      animation:glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow{
      0%{
        text-shadow:
          0 0 30px rgba(255,120,190,1),
          0 0 60px rgba(160,120,255,.9),
          0 0 100px rgba(255,120,190,.6);
      }
      100%{
        text-shadow:
          0 0 50px rgba(255,120,190,1),
          0 0 80px rgba(160,120,255,.9),
          0 0 120px rgba(255,120,190,.8);
      }
    }

    @media (max-width: 768px) {
      #birthday-message{
        font-size:1.05rem;
        padding:0 20px;
      }
    }

    /* NÚT BẬT NHẠC THEO YÊU CẦU */
    #musicControls{
      position: fixed;
      bottom: 20px;
      right: 15px;
      z-index: 1000;
      text-align: center;
    }

    #playMusicBtn{
      padding: 18px 45px;
      border: none;
      border-radius: 60px;
      font-size: 1.15rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg,#ff5ea8,#8c6dff);
      box-shadow: 0 12px 45px rgba(255,120,190,.75);
      transition: .3s;
    }

    #playMusicBtn:hover{
      transform: scale(1.08);
    }

    #playMusicBtn.playing{
      background: linear-gradient(135deg,#333,#555);
    }

    /* CSS NÚT BẤM TRÒ CHƠI MỚI */
    #gameBtn {
      margin-top: 25px;
      padding: 14px 35px;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, #12c2e9, #c471ed, #f64f59);
      box-shadow: 0 10px 30px rgba(196, 113, 237, 0.6);
      transition: 0.4s ease;
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
    }

    #gameBtn.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    #gameBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 15px 40px rgba(246, 79, 89, 0.8);
    }
  </style>
</head>

<body>

<!-- AUDIO ẨN -->
<audio id="backgroundMusic" autoplay loop>
  <source src="https://files.catbox.moe/zyxthq.mp3" type="audio/mpeg">
</audio>

<!-- NÚT BẬT NHẠC THEO YÊU CẦU -->
<div id="musicControls">
  <button id="playMusicBtn">đừng bấm vào ngại qa:<</button>
</div>

<canvas id="heart"></canvas>
<div id="falling-scene"></div>

<div id="message-container">
  <div id="birthday-message">
    <!-- THAY ĐỔI NỘI DUNG CHỮ Ở ĐÂY -->
    Chúc ebe của anh 1thang6 zui zẻ nhaa<br>Bao nhiêu tuổi thì vẫn mãi là em bé của anh thuồii<br>yeuu embe nhieu nhắmm ❤️
    <!-- KẾT THÚC THAY ĐỔI -->
  </div>
  <!-- THÊM NÚT BẤM CHƠI GAME VÀO ĐÂY -->
  <button id="gameBtn">bấm vào đây để chơi trò chơi nè lamm</button>
</div>

<script>

window.requestAnimationFrame =
  window.__requestAnimationFrame ||
  window.requestAnimationFrame ||
  window.webkitRequestAnimationFrame ||
  window.mozRequestAnimationFrame ||
  window.oRequestAnimationFrame ||
  window.msRequestAnimationFrame ||
  (function () {
    return function (callback, element) {
      var lastTime = element && element.__lastTime;
      if (lastTime === undefined) lastTime = 0;
      var currTime = Date.now();
      var timeToCall = Math.max(1, 33 - (currTime - lastTime));
      window.setTimeout(callback, timeToCall);
      if (element) element.__lastTime = currTime + timeToCall;
    };
  })();

window.isDevice = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(
  ((navigator.userAgent || navigator.vendor || window.opera) + "").toLowerCase()
);

const imageLinks = [
 "https://cdn.phototourl.com/free/2026-05-28-d89dcf79-a735-40e6-9678-23911530293c.jpg",
      "https://cdn.phototourl.com/free/2026-05-28-e2dc33bc-91d7-4ea0-94d2-276398ec771d.jpg",
      "https://cdn.phototourl.com/free/2026-05-28-ad2b4387-f58d-4e58-8dfe-b4cf62a1abf0.jpg",
      "https://cdn.phototourl.com/free/2026-05-28-cc19039f-e1f8-419b-9048-9e43ef3fa67f.jpg",
      "https://cdn.phototourl.com/free/2026-05-28-363e8d54-d8d2-4951-befb-4e8647061c91.jpg",
      "https://cdn.phototourl.com/free/2026-05-28-6cab9ecf-c18f-4b9c-aa0a-1743fe06ecc3.jpg",
      "https://cdn.phototourl.com/free/2026-05-28-c6b2791d-78b6-42c5-8790-53245b09e1a2.jpg",
      "https://cdn.phototourl.com/free/2026-05-28-80a1340f-743e-4f44-bb60-e82a87281bf0.jpg",
      "https://cdn.phototourl.com/free/2026-05-28-b4ea41d5-e7ae-4ad0-8c70-472da061641c.jpg",
      "https://cdn.phototourl.com/free/2026-05-28-b4ea41d5-e7ae-4ad0-8c70-472da061641c.jpg",
      "https://cdn.phototourl.com/free/2026-05-28-f0bf8bda-3ab1-417f-a7e6-ffea8f4beec8.jpg",
      "https://cdn.phototourl.com/member/2026-05-28-3ae4c82f-24ff-48b7-a4a9-f5bfc32d8949.jpg",
      "https://cdn.phototourl.com/member/2026-05-28-cb2c82a5-ae30-49b2-8292-6b19712d3c47.jpg",
      "https://cdn.phototourl.com/member/2026-05-28-d8e48673-58b9-47ec-bc5e-986b185acad0.jpg",
      "https://cdn.phototourl.com/member/2026-05-28-af4c5106-e4a3-4d7f-a65b-6c1490ce8875.jpg",
      "https://cdn.phototourl.com/member/2026-05-28-0cf0535f-37ce-451f-8f29-1f63b98d02aa.jpg",
      "https://cdn.phototourl.com/member/2026-05-28-1c822fdf-5873-47c7-bf02-d29e77b5847a.jpg",
      "https://cdn.phototourl.com/member/2026-05-28-ef7b7d23-a7d3-4d93-b0ea-25c71f4a187a.jpg",
      "https://cdn.phototourl.com/member/2026-05-28-d80e8372-df9b-47d8-bdfd-6e3ef3cfb977.jpg",
      "https://cdn.phototourl.com/member/2026-05-28-e0e5e921-0f6b-42f8-b9ab-53ba876548a1.jpg"
];

let loaded = false;
let heartStopped = false;
let fallingStarted = false;

const music = document.getElementById('backgroundMusic');
const playBtn = document.getElementById('playMusicBtn');
let isPlaying = false;

// ĐƯỜNG DẪN ĐẾN TRÒ CHƠI CỦA BẠN (Hãy đổi link "https://google.com" thành link game của bạn tại đây)
const URL_TRO_CHOI = "https://luongminhducphu26052010-jpg.github.io/ewfwefew/";

// XỬ LÝ NÚT BẬT NHẠC
playBtn.addEventListener('click', function() {
  if (!isPlaying) {
    music.play().then(() => {
      isPlaying = true;
      playBtn.textContent = 'o noooo';
      playBtn.classList.add('playing');
    }).catch(e => {
      alert('Ủa không phát được nhạc! Kiểm tra lại link nhé.');
    });
  } else {
    music.pause();
    isPlaying = false;
    playBtn.textContent = 'đừng bấm vào ngại qa:<';
    playBtn.classList.remove('playing');
  }
});

function showMessage(){
  document.getElementById("message-container").classList.add("show");
  
  // Hiển thị nút bấm trò chơi trễ hơn lời chúc 1 chút để tạo hiệu ứng mượt mà
  setTimeout(() => {
    document.getElementById("gameBtn").classList.add("show");
  }, 1000);
}

// Xử lý sự kiện khi nhấn vào nút chơi trò chơi
document.getElementById("gameBtn").addEventListener("click", function() {
  window.location.href = URL_TRO_CHOI;
});

function createFallingPhotos(){
  if(fallingStarted) return;
  fallingStarted = true;

  const scene = document.getElementById("falling-scene");
  scene.classList.add("show");

  const mobile = window.innerWidth < 768;
  const photoWidth = mobile ? 90 : 130;
  const photoHeight = mobile ? 120 : 175;
  const stringLength = window.innerHeight * 0.42;
  let photosFaded = 0;
  let usedXPositions = [];

  function getRandomX(){
    for(let t=0;t<100;t++){
      let x = 25 + Math.random() * (window.innerWidth - photoWidth - 50);
      let tooClose = false;
      for(let j=0;j<usedXPositions.length;j++){
        if(Math.abs(x - usedXPositions[j]) < photoWidth + 40){
          tooClose = true;
          break;
        }
      }
      if(!tooClose){
        usedXPositions.push(x);
        return x;
      }
    }
    return Math.random() * window.innerWidth;
  }

  imageLinks.forEach((link,index)=>{
    const container = document.createElement("div");
    container.className = "photo-container";

    const string = document.createElement("div");
    string.className = "string";
    string.style.height = stringLength + "px";

    const frame = document.createElement("div");
    frame.className = "photo-frame";

    const img = document.createElement("img");
    img.src = link;

    frame.appendChild(img);
    container.appendChild(string);
    container.appendChild(frame);

    const xPos = getRandomX();
    container.style.left = xPos + "px";
    container.style.top = "-" + (photoHeight + stringLength + 300 + Math.random()*200) + "px";
    scene.appendChild(container);

    const delay = 1000 + index * 1800 + Math.random() * 1200;

    setTimeout(()=>{
      const finalY = (window.innerHeight * (0.35 + Math.random()*0.4)) - photoHeight - stringLength;
      container.style.transition = "opacity .8s ease, top 7.5s cubic-bezier(0.25,0.46,0.45,0.94)";
      container.style.opacity = "1";
      container.style.top = finalY + "px";

      container.addEventListener("transitionend",function handler(e){
        if(e.propertyName !== "top") return;
        container.removeEventListener("transitionend", handler);

        setTimeout(()=>{
          container.style.transition = "opacity 1.5s ease";
          container.style.opacity = "0";

          container.addEventListener("transitionend",function fadeHandler(e2){
            if(e2.propertyName !== "opacity") return;
            container.removeEventListener("transitionend", fadeHandler);

            photosFaded++;
            if(photosFaded >= imageLinks.length){
              setTimeout(()=> showMessage(), 800);
            }
          });
        },1500);
      });
    },delay);
  });
}

function initHeart(){
  if(loaded) return;
  loaded = true;

  var mobile = window.isDevice;
  var koef = mobile ? 0.3 : 1;
  var canvas = document.getElementById("heart");
  var ctx = canvas.getContext("2d");
  var width = canvas.width = koef * innerWidth;
  var height = canvas.height = koef * innerHeight;
  var rand = Math.random;

  ctx.fillStyle = "rgba(0,0,0,1)";
  ctx.fillRect(0, 0, width, height);

  function heartPosition(rad){
    return[
      Math.pow(Math.sin(rad), 3),
      -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad))
    ];
  }

  function scaleAndTranslate(pos, sx, sy, dx, dy){
    return[dx + pos[0]*sx, dy + pos[1]*sy];
  }

  window.addEventListener("resize", function () {
    width = canvas.width = koef * innerWidth;
    height = canvas.height = koef * innerHeight;
    ctx.fillStyle = "rgba(0,0,0,1)";
    ctx.fillRect(0, 0, width, height);
  });

  var traceCount = mobile ? 15 : 50;
  var pointsOrigin = [];
  var i;
  var dr = mobile ? 0.35 : 0.1;

  for(i = 0; i < Math.PI * 2; i += dr){
    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 210, 13, 0, 0));
  }
  for(i = 0; i < Math.PI * 2; i += dr){
    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 150, 9, 0, 0));
  }
  for(i = 0; i < Math.PI * 2; i += dr){
    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 90, 5, 0, 0));
  }

  var heartPointsCount = pointsOrigin.length;
  var targetPoints = [];

  function pulse(kx, ky){
    for(i = 0; i < pointsOrigin.length; i++){
      targetPoints[i] = [];
      targetPoints[i][0] = kx * pointsOrigin[i][0] + width / 2;
      targetPoints[i][1] = ky * pointsOrigin[i][1] + height / 2;
    }
  }

  var e = [];
  for(i = 0; i < heartPointsCount; i++){
    var x = rand() * width;
    var y = rand() * height;
    var trace = [];
    for(var k = 0; k < traceCount; k++){
      trace[k] = {x: x, y: y};
    }

    e[i] = {
      vx: 0, vy: 0,
      speed: rand() + 5,
      q: ~~(rand() * heartPointsCount),
      D: 2 * (i % 2) - 1,
      force: 0.2 * rand() + 0.7,
      f: "hsla(0," + ~~(40 * rand() + 60) + "%," + ~~(60 * rand() + 20) + "%,.3)",
      trace: trace
    };
  }

  var config = {traceK: 0.4, timeDelta: 0.01};
  var time = 0;
  var startTime = Date.now();

  function loop(){
    if(heartStopped) return;

    var n = -Math.cos(time);
    pulse((1 + n) * 0.5, (1 + n) * 0.5);
    time += ((Math.sin(time) < 0) ? 9 : (n > 0.8 ? 0.2 : 1)) * config.timeDelta;

    ctx.fillStyle = "rgba(0,0,0,.1)";
    ctx.fillRect(0, 0, width, height);

    for(i = e.length; i--;){
      var u = e[i];
      var q = targetPoints[u.q];
      var dx = u.trace[0].x - q[0];
      var dy = u.trace[0].y - q[1];
      var length = Math.sqrt(dx * dx + dy * dy) || 1;

      if(length < 10){
        if(rand() > 0.95){
          u.q = ~~(rand() * heartPointsCount);
        } else {
          if(rand() > 0.99) u.D *= -1;
          u.q += u.D;
          u.q %= heartPointsCount;
          if(u.q < 0) u.q += heartPointsCount;
        }
      }

      u.vx += -dx / length * u.speed;
      u.vy += -dy / length * u.speed;
      u.trace[0].x += u.vx;
      u.trace[0].y += u.vy;
      u.vx *= u.force;
      u.vy *= u.force;

      for(k = 0; k < u.trace.length - 1;){
        var T = u.trace[k];
        var N = u.trace[++k];
        N.x -= config.traceK * (N.x - T.x);
        N.y -= config.traceK * (N.y - T.y);
      }

      ctx.fillStyle = u.f;
      for(k = 0; k < u.trace.length; k++){
        ctx.fillRect(u.trace[k].x, u.trace[k].y, 1, 1);
      }
    }

    if(Date.now() - startTime >= 10000){
      heartStopped = true;
      canvas.classList.add("hide");
      createFallingPhotos();
      return;
    }

    window.requestAnimationFrame(loop, canvas);
  }

  loop();
}

var s = document.readyState;
if(s === "complete" || s === "loaded" || s === "interactive"){
  initHeart();
} else {
  document.addEventListener("DOMContentLoaded", initHeart, false);
}

</script>

</body>
</html>
